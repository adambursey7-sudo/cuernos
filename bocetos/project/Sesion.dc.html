<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sesión del día</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B8430F}a:hover{color:#8F330B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F4F7; font-family: Barlow, sans-serif; color: #0F1B2D; display: flex; flex-direction: column">
  <div style="padding: 24px 20px 12px; display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="Volver" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0F1B2D">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700; line-height: 1">Martes · Cadete femenino</h1>
      <div style="font-size: 14px; color: #4A5568">19:00 – 20:30 · 10 jugadoras · 2 entrenadores</div>
    </div>
  </div>

  <div style="margin: 4px 20px 12px; background: #FFFFFF; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: #4A5568">Objetivo</div>
    <div style="font-size: 16px; font-weight: 600">Cuernos: pase al codo y puerta atrás</div>
    <div style="font-size: 14px; color: #2D3748">Secundario: defensa del bloqueo directo</div>
  </div>

  <div style="margin: 0 20px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{bloques}}" as="b" hint-placeholder-count="6">
      <div style="background: #FFFFFF; border-radius: 12px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; min-height: 56px; box-sizing: border-box">
        <div style="width: 48px; flex-shrink: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; color: #B8430F">{{b.min}}</div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <div style="font-weight: 600; font-size: 15px">{{b.nombre}}</div>
          <div style="font-size: 13px; color: #4A5568">{{b.detalle}}</div>
        </div>
        <div style="font-size: 13px; font-weight: 600; color: #0F1B2D; background: #E3E8EF; border-radius: 6px; padding: 4px 8px">{{b.dur}}</div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 8px">
    <button type="button" style="min-height: 48px; border-radius: 12px; border: 1.5px dashed #4A5568; background: transparent; color: #0F1B2D; font: 600 15px Barlow, sans-serif">+ Añadir ejercicio de la biblioteca</button>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="min-height: 48px; border-radius: 12px; border: 0; background: #B8430F; color: #FFFFFF; font: 600 15px Barlow, sans-serif">Imprimir ficha</button>
      <button type="button" style="min-height: 48px; border-radius: 12px; border: 1.5px solid #0F1B2D; background: #FFFFFF; color: #0F1B2D; font: 600 15px Barlow, sans-serif">Mandar al ayudante</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      bloques: [
        { min: '19:00', nombre: 'Calentamiento con balón', detalle: 'Rueda de pases y entradas', dur: '12 min' },
        { min: '19:12', nombre: '2x0 pase al codo y mano a mano', detalle: '2 canastas · 5 parejas', dur: '12 min' },
        { min: '19:24', nombre: '3x0 puerta atrás de la esquina', detalle: 'Base, codo y esquina', dur: '15 min' },
        { min: '19:39', nombre: '2x2 defensa del bloqueo directo', detalle: 'Pasar por detrás y cambio', dur: '18 min' },
        { min: '19:57', nombre: '5x5 cuernos con puntos dobles', detalle: 'Doble si acaba en puerta atrás', dur: '25 min' },
        { min: '20:22', nombre: 'Vuelta a la calma y charla', detalle: '3 frases preparadas', dur: '8 min' }
      ]
    };
  }
}
</script>
</body>
</html>
